info:
  name: Update Account
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/accounts/:accountId"
  params:
    - name: accountId
      value: "{{accountId}}"
      type: path
      description: Account UUID
  body:
    type: json
    data: |-
      {
        "id": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
        "name": "Main Checking Updated",
        "institution": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
        "accountType": "LIQUIDITY",
        "balance": 3000,
        "currency": "EUR",
        "excludeFromStats": false,
        "archive": false,
        "createdAt": "2025-01-15T10:30:00Z",
        "updatedAt": "2025-01-15T10:30:00Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
