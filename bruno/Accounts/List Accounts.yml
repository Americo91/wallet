info:
  name: List Accounts
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/accounts"
  params:
    - name: name
      value: Revolut
      type: query
      disabled: true

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
