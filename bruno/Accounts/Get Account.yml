info:
  name: Get Account
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/accounts/:accountId"
  params:
    - name: accountId
      value: "{{accountId}}"
      type: path
      description: Account UUID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
