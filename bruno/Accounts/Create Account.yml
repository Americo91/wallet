info:
  name: Create Account
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/institutions/:institutionId/accounts"
  params:
    - name: institutionId
      value: "{{institutionId}}"
      type: path
      description: Institution UUID
  body:
    type: json
    data: |-
      {
        "id": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
        "name": "Main Checking",
        "institution": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
        "accountType": "LIQUIDITY",
        "balance": 2500.75,
        "currency": "EUR",
        "excludeFromStats": false,
        "archive": false,
        "createdAt": "2025-01-15T10:30:00Z",
        "updatedAt": "2025-01-15T10:30:00Z"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accountId", res.body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
