info:
  name: Get Transaction
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions/:transactionId"
  params:
    - name: transactionId
      value: "{{transactionId}}"
      type: path
      description: Transaction UUID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
