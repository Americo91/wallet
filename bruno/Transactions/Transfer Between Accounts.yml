info:
  name: Transfer Between Accounts
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/accounts/:fromAccountId/transfer/:toAccountId"
  params:
    - name: fromAccountId
      value: b2c3d4e5-f6a7-8901-bcde-f12345678901
      type: path
      description: Source account UUID
    - name: toAccountId
      value: c3d4e5f6-a7b8-9012-cdef-123456789012
      type: path
      description: Destination account UUID
  body:
    type: json
    data: |-
      {
        "amount": 500,
        "date": "2025-06-15",
        "description": "Monthly savings transfer",
        "payee": null,
        "labels": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
