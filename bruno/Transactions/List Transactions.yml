info:
  name: List Transactions
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var transactionId = res.body[0].id
        bru.setEnvVar("transactionId", transactionId)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
