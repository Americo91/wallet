info:
  name: Create Category
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/categories"
  body:
    type: json
    data: |-
      {
        "id": "d4e5f6a7-b8c9-0123-defa-234567890123",
        "name": "Groceries",
        "type": "EXPENSE",
        "parentId": null,
        "createdAt": "2025-01-10T08:00:00Z",
        "updatedAt": "2025-01-10T08:00:00Z"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var categoryId = res.body.id
        bru.setEnvVar("categoryId", categoryId)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
