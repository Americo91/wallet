info:
  name: Get Category
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/categories/:categoryId"
  params:
    - name: categoryId
      value: "{{categoryGroceries}}"
      type: path
      description: Category UUID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
