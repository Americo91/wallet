info:
  name: Delete Category
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/categories/:categoryId"
  params:
    - name: categoryId
      value: "{{categoryId}}"
      type: path
      description: Category UUID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
