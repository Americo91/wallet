info:
  name: Get Budget
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/budgets/:budgetId"
  params:
    - name: budgetId
      value: "{{budgetId}}"
      type: path
      description: Budget UUID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
