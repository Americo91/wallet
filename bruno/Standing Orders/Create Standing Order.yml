info:
  name: Create Standing Order
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/accounts/:accountId/standing-orders"
  params:
    - name: accountId
      value: "{{accountId}}"
      type: path
      description: Account UUID
  body:
    type: json
    data: |-
      {
        "id": "b8c9d0e1-f2a3-4567-cdef-678901234567",
        "name": "Spotify",
        "amount": 9.99,
        "currency": "EUR",
        "frequency": "MONTHLY",
        "type": "EXPENSE",
        "nextOccurrence": "2026-07-05",
        "account": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
        "category": "00000000-0000-0000-0000-000000000501",
        "labels": [
          "00000000-0000-0001-0000-000000000005"
        ],
        "description": "Spotify Premium subscription",
        "payee": "Spotify AB",
        "enabled": true,
        "createdAt": "2025-03-01T09:00:00Z",
        "updatedAt": "2025-03-01T09:00:00Z",
        "startingDate": "2025-07-01"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("standingOrderId", res.body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
