info:
  name: Get Standing Order
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/standing-orders/:standingOrderId"
  params:
    - name: standingOrderId
      value: "{{standingOrderId}}"
      type: path
      description: Standing order UUID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
