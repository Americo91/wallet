info:
  name: Create Institution
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/institutions"
  body:
    type: json
    data: |-
      {
        "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
        "name": "Intesa Sanpaoloa",
        "color": "#1A73E8",
        "accounts": [
          "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        ],
        "createdAt": "2025-01-15T10:30:00Z",
        "updatedAt": "2025-01-15T10:30:00Z"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        let institutionId = data.id;
        bru.setEnvVar("institutionId", institutionId)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
