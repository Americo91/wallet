info:
  name: Delete Institution
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/institutions/:institutionId"
  params:
    - name: institutionId
      value: "{{institutionId}}"
      type: path
      description: Institution UUID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
