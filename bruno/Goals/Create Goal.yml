info:
  name: Create Goal
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/goals"
  body:
    type: json
    data: |-
      {
        "id": "a7b8c9d0-e1f2-3456-bcde-567890123456",
        "name": "Emergency Fund",
        "amount": 1000,
        "savedAmount": 0,
        "reached": false,
        "createdAt": "2025-01-01T00:00:00Z",
        "updatedAt": "2025-06-15T12:00:00Z"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var id = res.body.id
        bru.setEnvVar("goalId", id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
