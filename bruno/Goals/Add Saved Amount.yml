info:
  name: Add Saved Amount
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/goals/:goalId/addSavedAmount"
  params:
    - name: goalId
      value: "{{goalId}}"
      type: path
      description: Goal UUID
  body:
    type: json
    data: "250"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
