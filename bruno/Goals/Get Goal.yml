info:
  name: Get Goal
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/goals/:goalId"
  params:
    - name: goalId
      value: "{{goalId}}"
      type: path
      description: Goal UUID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
