info:
  name: Create Account
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/institutions/:institutionId/accounts"
  params:
    - name: institutionId
      value: "{{institutionId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Main Checking",
        "accountType": "LIQUIDITY",
        "balance": 2500.75,
        "currency": "EUR",
        "excludeFromStats": false,
        "archive": false
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accountId", res.body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
