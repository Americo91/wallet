info:
  name: List Labels
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/labels?name=Fixed Cost"
  params:
    - name: name
      value: Fixed Cost
      type: query

runtime:
  scripts:
    - type: after-response
      code: |-
        var label = res.body[0].id
        bru.setEnvVar("labelId", label)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
