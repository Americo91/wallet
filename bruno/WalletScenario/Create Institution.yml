info:
  name: Create Institution
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/institutions"
  body:
    type: json
    data: |-
      {
        "name": "Intesa Sanpaolo",
        "color": "#1A73E8"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        let institutionId = data.id;
        bru.setEnvVar("institutionId", institutionId)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
