spring.application.name=wallet

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
#spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath*:scripts/*.sql

# Disable mail in tests
spring.mail.host=localhost
spring.mail.port=25

# Disable standing order notifications in tests
wallet.notification.enabled=false
wallet.notification.days-ahead=3
wallet.notification.recipient=