          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/institutions/{institutionId}/accounts/:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create a new account under an institution
      parameters:
