openapi: 3.1.0
info:
  title: Wallet API
  description: Personal finance management REST API for tracking accounts, transactions, budgets, and goals
  version: 1.0.0
  contact:
    name: Wallet
    url: https://github.com/Americo91/wallet
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Institutions
    description: Manage financial institutions
  - name: Accounts
    description: Manage bank and investment accounts
  - name: Transactions
    description: Record and manage income/expense transactions
  - name: Categories
    description: Manage transaction categories (hierarchical)
  - name: Labels
    description: Manage transaction labels/tags
  - name: Budgets
    description: Create and track spending budgets
  - name: Goals
    description: Set and track savings goals
  - name: Standing Orders
    description: Manage recurring transactions
paths:
  # ── Institutions ──────────────────────────────────────────────
  /api/v1/institutions/:
    get:
      tags: [Institutions]
      operationId: listInstitutions
      summary: List all institutions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstitutionDto"
    post:
      tags: [Institutions]
      operationId: createInstitution
      summary: Create a new institution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionDto"
      responses:
        "201":
          description: Institution created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionDto"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/institutions:
    get:
      tags: [Institutions]
      operationId: getInstitutionByName
      summary: Find institution by name
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Institution found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionDto"
        "400":
          description: Institution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/institutions/{institutionId}:
    get:
      tags: [Institutions]
      operationId: getInstitutionById
      summary: Get institution by ID
      parameters:
        - $ref: "#/components/parameters/InstitutionId"
      responses:
        "200":
          description: Institution found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionDto"
        "400":
          description: Institution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    put:
      tags: [Institutions]
      operationId: updateInstitution
      summary: Update an institution
      parameters:
        - $ref: "#/components/parameters/InstitutionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionDto"
      responses:
        "204":
          description: Institution updated
        "400":
          description: Validation error or institution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    delete:
      tags: [Institutions]
      operationId: deleteInstitution
      summary: Delete an institution
      parameters:
        - $ref: "#/components/parameters/InstitutionId"
      responses:
        "204":
          description: Institution deleted
        "400":
          description: Institution not found
          content:
            application/json:
              schema:
