  /api/v1/accounts/{accountId}/transactions/:
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Create a new transaction for an account
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionDto"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDto"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/accounts/{accountId}/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactionsByAccount
      summary: List all transactions for an account
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionDto"
        "400":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/accounts/{fromAccountId}/transfer/{toAccountId}:
    post:
      tags: [Transactions]
      operationId: transferBetweenAccounts
      summary: Transfer funds between two accounts
      description: Creates paired EXPENSE and INCOME transactions across the source and destination accounts.
      parameters:
        - name: fromAccountId
          in: path
          required: true
          description: Source account UUID
          schema:
            type: string
            format: uuid
        - name: toAccountId
          in: path
          required: true
          description: Destination account UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferDto"
      responses:
        "201":
          description: Transfer completed (returns the two created transactions)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionDto"
        "400":
          description: Validation error or account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

