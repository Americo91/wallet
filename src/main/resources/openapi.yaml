  /api/v1/accounts/{accountId}/standing-orders/:
    post:
      tags: [Standing Orders]
      operationId: createStandingOrder
      summary: Create a new standing order for an account
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandingOrderDto"
      responses:
        "201":
          description: Standing order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingOrderDto"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

